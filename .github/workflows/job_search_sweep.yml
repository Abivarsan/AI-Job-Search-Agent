name: AI Job Search 3-Hour Agent & Dashboard Sync

on:
  schedule:
    # Runs every 3 hours at minute 0 (8 times a day: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: job-search-3hr
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 1. Multi-Portal Scraping, AI Evaluation, and Dataset Sync
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Deduplication Database Cache
        uses: actions/cache@v4
        id: db-cache
        with:
          path: jobs.db
          key: jobs-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jobs-db-${{ runner.os }}-
            jobs-db-

      - name: Run Job Search Sweep & AI Evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          MIN_MATCH_SCORE: ${{ vars.MIN_MATCH_SCORE || '70' }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          SEARCH_KEYWORDS: ${{ vars.SEARCH_KEYWORDS || 'Associate Software Engineer, Software Engineer, Junior Software Engineer, .NET Developer, Java Developer' }}
          SEARCH_LOCATIONS: ${{ vars.SEARCH_LOCATIONS || 'Sri Lanka, Remote' }}
        run: |
          python main.py --run-once
          python main.py --stats

      - name: Export Web Dashboard Dataset
        run: python main.py --export-web

      - name: Commit & Sync Web Dashboard Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/jobs.json
          git diff --staged --quiet || (git commit -m "chore: update web dashboard job listings [skip ci]" && git push origin HEAD)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Upload Database Backup Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobs-database-backup
          path: jobs.db
          retention-days: 90

  # 2. Dedicated GitHub Pages Deployment Job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sweep
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
